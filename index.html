<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lyrix Hosting - Schneller und zuverlässiger Hosting-Service für deine Game-Server.">
    <title>Lyrix Hosting</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100vh;
        }

        .logo-container {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .logo-container img {
            height: 120px;
            width: auto;
            border: 3px solid #fff; /* Weißer Rand */
            border-radius: 5px;     /* Abgerundete Ecken */
        }

        .content {
            margin-top: auto;
            margin-bottom: auto;
        }

        header {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            font-size: 1.2rem;
            margin: 0 0 30px;
            color: #bbb;
        }

        .button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #333;
            color: white;
            border: 2px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 10px 0;
        }

        .button:hover {
            background-color: #555;
            transform: scale(1.05);
        }

        footer {
            margin-top: auto;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.png" alt="Lyrix Hosting Logo">
    </div>

    <div class="content">
        <header>Willkommen bei Lyrix Hosting</header>
        <p>Tote website ich weiß.</p>
        <a href="https://panel.lyrixhost.com" class="button">Zum Panel</a>
        <a href="https://support.lyrixhost.com" class="button">Support</a>
    </div>

    <footer>&copy; 2025 Lyrix Hosting</footer>

</body>
</html>
