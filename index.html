<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lyrix Hosting - Schneller und zuverlässiger Hosting-Service für deine Game-Server.">
    <title>Lyrix Hosting</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        header {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            font-size: 1.2rem;
            margin: 0 0 30px;
            color: #bbb;
        }

        .button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #333;
            color: white;
            border: 2px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .button:hover {
            background-color: #555;
            transform: scale(1.05);
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <header>Willkommen bei Lyrix Hosting</header>
    <p>Dein zuverlässiger Partner für schnelles und sicheres Hosting von Game-Servern.</p>
    <a href="https://panel.lyrixhost.com" class="button">Zum Panel</a>

    <footer>&copy; 2025 Lyrix Hosting</footer>

</body>
</html>
